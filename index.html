<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onde alugar: BH ou Juiz de Fora</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      background: #f4f4ef;
      color: #172a30;
      font: 16px/1.5 Arial, sans-serif;
    }

    main {
      width: min(100%, 760px);
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 7vw, 52px);
      letter-spacing: -0.05em;
      line-height: 1.05;
    }

    header p {
      margin: 0;
      color: #495c5c;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
      gap: 16px;
    }

    .city {
      display: flex;
      min-height: 190px;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      border: 1px solid #d9ded9;
      border-radius: 15px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      transition: border-color 150ms ease, transform 150ms ease;
    }

    .city:hover {
      transform: translateY(-2px);
      border-color: #56817b;
    }

    .city:focus-visible {
      outline: 3px solid #28766f;
      outline-offset: 3px;
    }

    .city h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .city p {
      margin: 0;
      color: #495c5c;
    }

    .action {
      margin-top: 24px;
      color: #164b54;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Onde você quer alugar?</h1>
      <p>Escolha uma cidade para consultar o mapa e os custos dos bairros.</p>
    </header>
    <nav aria-label="Escolha uma cidade">
      <a class="city" href="bh.html">
        <div>
          <h2>Belo Horizonte</h2>
          <p>Veja a comparação de bairros em BH.</p>
        </div>
        <span class="action">Ver Belo Horizonte &rarr;</span>
      </a>
      <a class="city" href="jf.html">
        <div>
          <h2>Juiz de Fora</h2>
          <p>Veja a comparação de bairros em Juiz de Fora.</p>
        </div>
        <span class="action">Ver Juiz de Fora &rarr;</span>
      </a>
    </nav>
  </main>
</body>
</html>
